name: probably_works
description: "Настольный ИИ-агент для локальной машины и SSH; модели через OpenRouter, llama.cpp и локальные GGUF."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

workspace:
  - packages/app_ui
  - packages/plugin_api
  - packages/plugin_api_ui
  - packages/plugin_declarative_commands
  - packages/plugin_declarative_commands_core
  - packages/plugin_declarative_http
  - packages/plugin_declarative_http_core
  - packages/plugin_web
  - packages/plugin_web_core
  - packages/pw_agent
  - packages/pw_client
  - packages/pw_server
  - packages/virtual_git
  - packages/virtual_host

dependencies:
  app_ui:
    path: packages/app_ui
  auto_route: ^11.1.0
  background_downloader: ^9.6.6
  bloc: ^9.2.1
  characters: ^1.4.0
  command_shield: ^1.4.0
  crypto: ^3.0.8
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  drift: ^2.35.0
  equatable: ^3.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: 23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_pty2:
    path: third_party/flutter_pty2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.2.1
  http: ^1.5.0
  injectable: ^3.0.0
  intl: ^0.20.3
  llamadart: ^0.19.10
  logging: ^1.3.0
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  material_ui: ^1.9.0
  mcp_dart: ^2.4.3
  openrouter:
    git:
      url: https://github.com/The28AWG/openrouter.git
      # В main нет сгенерированных файлов: фиксируем commit из тега
      # dist-v1.0.1, где пакет собирается и содержит нужный код.
      ref: 54be90547727663313ae933ce2f10ee36cb9ec0f
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  plugin_api:
    path: packages/plugin_api
  plugin_api_ui:
    path: packages/plugin_api_ui
  plugin_declarative_commands:
    path: packages/plugin_declarative_commands
  plugin_declarative_commands_core:
    path: packages/plugin_declarative_commands_core
  plugin_declarative_http:
    path: packages/plugin_declarative_http
  plugin_declarative_http_core:
    path: packages/plugin_declarative_http_core
  plugin_web:
    path: packages/plugin_web
  plugin_web_core:
    path: packages/plugin_web_core
  pw_agent:
    path: packages/pw_agent
  pw_client:
    path: packages/pw_client
  shared_preferences: ^2.5.6
  sqlite3: ^3.6.0
  url_launcher: ^6.3.3
  uuid: ^4.5.3
  virtual_git:
    path: packages/virtual_git
  virtual_host:
    path: packages/virtual_host
  # xterm 4 не обновляется с 2024 года; xterm2 — поддерживаемый форк с тем же API.
  xterm2: ^5.4.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

# xterm2 объявляет equatable ^2.0.3, но не импортирует его. Держим override,
# пока пакет не обновит или не удалит неиспользуемую зависимость.
dependency_overrides:
  equatable: 3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/os_linux.svg
    - assets/icons/os_macos.svg
    - assets/icons/os_windows.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700

# Нативные рантаймы llamadart. В приложение и демон попадает только
# llama.cpp: LiteRT-LM не используется, а его архивы заметно увеличивают
# сборку. Список задаётся в корне workspace — hook читает только его.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
