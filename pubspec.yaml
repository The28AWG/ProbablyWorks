name: probably_works
description: "Настольный ИИ-агент, выполняющий задачи на локальной машине или по SSH; модели через OpenRouter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

workspace:
  - packages/app_ui
  - packages/plugin_api
  - packages/plugin_api_ui
  - packages/plugin_declarative_commands
  - packages/plugin_declarative_commands_core
  - packages/plugin_declarative_http
  - packages/plugin_declarative_http_core
  - packages/pw_agent
  - packages/pw_client
  - packages/pw_server
  - packages/virtual_git
  - packages/virtual_host

dependencies:
  app_ui:
    path: packages/app_ui
  auto_route: ^11.1.0
  bloc: ^9.2.1
  characters: ^1.4.0
  command_shield: ^1.4.0
  cupertino_icons: ^1.0.8
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  drift: ^2.35.0
  equatable: ^2.0.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  http: ^1.5.0
  injectable: ^3.0.0
  intl: ^0.20.3
  logging: ^1.3.0
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  material_ui: ^1.9.0
  mcp_dart: ^2.4.3
  openrouter:
    git:
      url: https://github.com/The28AWG/openrouter.git
      tag_pattern: dist-v{{version}}
    version: ^1.0.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  plugin_api:
    path: packages/plugin_api
  plugin_api_ui:
    path: packages/plugin_api_ui
  plugin_declarative_commands:
    path: packages/plugin_declarative_commands
  plugin_declarative_commands_core:
    path: packages/plugin_declarative_commands_core
  plugin_declarative_http:
    path: packages/plugin_declarative_http
  plugin_declarative_http_core:
    path: packages/plugin_declarative_http_core
  portable_pty: 0.0.7-beta.2
  pw_agent:
    path: packages/pw_agent
  pw_client:
    path: packages/pw_client
  sqlite3: ^3.6.0
  url_launcher: ^6.3.3
  uuid: ^4.5.3
  virtual_git:
    path: packages/virtual_git
  virtual_host:
    path: packages/virtual_host
  xterm: ^4.0.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/os_linux.svg
    - assets/icons/os_macos.svg
    - assets/icons/os_windows.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
