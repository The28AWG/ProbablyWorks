name: probably_works
description: "Настольный ИИ-агент, выполняющий задачи на локальной машине или по SSH; модели через OpenRouter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  auto_route: ^11.1.0
  bloc: ^9.2.1
  characters: ^1.4.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  drift: ^2.35.0
  equatable: ^2.0.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.3
  logging: ^1.3.0
  markdown_widget: ^2.3.2+8
  material_ui: ^1.9.0
  openrouter:
    git:
      url: https://github.com/The28AWG/openrouter.git
      tag_pattern: dist-v{{version}}
    version: ^1.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  uuid: ^4.5.3

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
flutter:
  generate: true
  uses-material-design: true