version: 2
updates:
  # Корневой pubspec — workspace: lock-файл один на все пакеты.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Вендоренный форк обновляется вручную вместе с патчами:
      # docs/agent/PTY.md. Фактические версии фиксирует pubspec.lock.
      - dependency-name: "flutter_pty2"
