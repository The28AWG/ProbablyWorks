name: Platforms

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'assets/**'
      - 'tool/package/**'
      - 'tool/ci/check_bundle.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'ios/**'
      - 'third_party/flutter_pty2/**'
      - 'snap/**'
      - '.github/actions/**'
      - '.github/workflows/platforms.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'assets/**'
      - 'tool/package/**'
      - 'tool/ci/check_bundle.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'ios/**'
      - 'third_party/flutter_pty2/**'
      - 'snap/**'
      - '.github/actions/**'
      - '.github/workflows/platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libnotify-dev
      - uses: ./.github/actions/generate
      - name: Build Linux GUI
        run: flutter build linux --release
      - name: Add headless daemon
        env:
          PLATFORM: linux
          BUILD_OUTPUT_DIRECTORY: build/linux/x64/release/bundle
        run: dart run tool/package/prepare_daemon.dart
      - name: Check Linux assembly
        run: >-
          dart run tool/ci/check_bundle.dart
          --platform=linux
          --root=build/linux/x64/release/bundle

  windows-assembly:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - uses: ./.github/actions/generate
      - name: Test Windows ConPTY
        run: flutter test test/host/windows_conpty_test.dart
      - name: Build Windows GUI
        run: flutter build windows --release
      - name: Add headless daemon
        env:
          PLATFORM: windows
          BUILD_OUTPUT_DIRECTORY: build/windows/x64/runner/Release
        run: dart run tool/package/prepare_daemon.dart
      - name: Check Windows assembly
        run: >-
          dart run tool/ci/check_bundle.dart
          --platform=windows
          --root=build/windows/x64/runner/Release

  macos-assembly:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - uses: ./.github/actions/generate
      - uses: ./.github/actions/select-xcode
      - name: Build macOS GUI
        run: flutter build macos --release
      - name: Add headless daemon
        env:
          PLATFORM: macos
          BUILD_OUTPUT_DIRECTORY: build/macos/Build/Products/Release
        run: dart run tool/package/prepare_daemon.dart
      - name: Check macOS assembly
        run: >-
          dart run tool/ci/check_bundle.dart
          --platform=macos
          --root=build/macos/Build/Products/Release
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Check iOS assembly
        run: >-
          dart run tool/ci/check_bundle.dart
          --platform=ios
          --root=build/ios/iphonesimulator/Runner.app
