name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        # Релиз и дистрибуция проверяют коммит со счётчиком, а не SHA вызывающего run:
        # он появляется уже после bump-коммита. Пустое значение = обычный ref события.
        description: Коммит, который нужно проверить
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libnotify-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate DI and routes
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate agent DI
        working-directory: packages/pw_agent
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool packages

      - name: Analyze app
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Analyze and test all packages
        run: tool/ci/test_packages.sh

      # Release собирает web только по тегу. Здесь проверяем оба entrypoint
      # на каждом PR, чтобы поломка static/hosted не всплыла только в релизе.
      - name: Build web clients
        run: |
          flutter build web -t lib/main_web.dart --release \
            -o build/web-static --base-href=/
          flutter build web -t lib/main_web_hosted.dart --release \
            -o build/web-hosted --base-href=/

      - name: Integration test real daemon
        env:
          PW_DAEMON_TEST: '1'
        run: flutter test test/app/profiles/local_daemon_integration_test.dart

  windows-keyring:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Credential Manager smoke test
        working-directory: packages/pw_agent
        run: dart test test/core/windows_credential_backend_test.dart
