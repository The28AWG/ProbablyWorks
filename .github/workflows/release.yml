name: Release

# Выпуск GitHub Release: только то, что пользователь скачивает и ставит сам.
# Дистрибуции в магазины (AAB, IPA, Snap) живут в отдельных workflow и в релиз не входят.
#
# Порядок: номер сборки на main → проверки и сборки на этом коммите → тег и
# опубликованный релиз только при успехе всех сборок. Тег создаётся как следствие
# успешной сборки, а не до неё.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Маркетинговая версия X.Y.Z (номер сборки назначается автоматически)
        required: true
        type: string

permissions:
  contents: write

# Общая группа со всеми workflow, которые меняют счётчик: релиз и дистрибуции идут по очереди.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  bump:
    name: Bump build number
    uses: ./.github/workflows/bump-build-number.yml
    with:
      marketing_version: ${{ inputs.version }}

  checks:
    name: CI checks
    needs: bump
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  prepare:
    name: Prepare sources
    needs: [bump, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate DI and routes
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate agent DI
        working-directory: packages/pw_agent
        run: dart run build_runner build --delete-conflicting-outputs

      # Тесты уже выполнены в jobs.checks; здесь нужна только генерация.
      - name: Archive generated sources
        run: |
          tar -czf generated-sources.tar.gz \
            lib/app/router/app_router.gr.dart \
            lib/app/di/injection_native.config.dart \
            lib/l10n/generated \
            packages/pw_agent/lib/agent_di.config.dart \
            packages/pw_agent/lib/core/db/app_database.g.dart

      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: generated-sources.tar.gz
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web client
    needs: [bump, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build static web client
        run: >-
          flutter build web -t lib/main_web.dart --release
          -o build/web-static --base-href=/

      - name: Build hosted web client
        run: >-
          flutter build web -t lib/main_web_hosted.dart --release
          -o build/web-hosted --base-href=/

      - name: Package static web client
        run: >-
          dart run tool/package/package_web.dart
          --web-dir=build/web-static

      - name: Upload static web package
        uses: actions/upload-artifact@v4
        with:
          name: probably-works-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload hosted web build
        uses: actions/upload-artifact@v4
        with:
          name: web-hosted
          path: build/web-hosted
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.artifact }}
    needs: [bump, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            targets: appimage,deb,tar.gz,zip
            artifact: probably-works-linux-x64
            suffix: '-x64'
          - os: windows-latest
            platform: windows
            targets: exe,zip
            artifact: probably-works-windows-x64
            suffix: '-x64'
          - os: macos-latest
            platform: macos
            targets: dmg,zip
            artifact: probably-works-macos-arm64
            suffix: '-arm64'
          - os: macos-15-intel
            platform: macos
            targets: dmg,zip
            artifact: probably-works-macos-x64
            suffix: '-x64'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Install Linux build and packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'macos'
        run: npm install --global appdmg

      - name: Select Xcode 26
        if: matrix.platform == 'macos'
        uses: ./.github/actions/select-xcode

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: dart pub global activate fastforge 0.6.14

      - name: Add Fastforge to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Add Fastforge to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Pub\Cache\bin"

      - name: Build packages
        run: >-
          dart run tool/package/package.dart
          ${{ matrix.platform }}
          ${{ matrix.targets }}
          --artifact-suffix=${{ matrix.suffix }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  server:
    name: Server ${{ matrix.artifact }}
    needs: [bump, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: probably-works-server-linux-x64
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: probably-works-server-windows-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact: probably-works-server-macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact: probably-works-server-macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Package standalone server
        run: >-
          dart run tool/package/package_server.dart
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}

      - name: Upload server packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  server-web:
    name: Server + web ${{ matrix.artifact }}
    needs: [bump, prepare, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: probably-works-server-web-linux-x64
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: probably-works-server-web-windows-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact: probably-works-server-web-macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact: probably-works-server-web-macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - name: Download hosted web build
        uses: actions/download-artifact@v4
        with:
          name: web-hosted
          path: build/web-hosted

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Package server + web
        run: >-
          dart run tool/package/package_server_web.dart
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}
          --web-dir=build/web-hosted

      - name: Upload server + web packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: [bump, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Секреты читаются на уровне job, потому что условие `if` на уровне step не видит secrets.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      # Без секрета подписи APK не собирается и в релиз не попадает. Это не ошибка:
      # релиз выходит без Android. Частично заданные секреты — ошибка конфигурации.
      - name: Check signing secrets
        id: signing
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Секрет подписи Android не задан: APK не войдёт в релиз."
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Задан ANDROID_KEYSTORE_BASE64, но не заданы остальные секреты подписи."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download generated sources
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        if: steps.signing.outputs.enabled == 'true'
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Write signing configuration
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Resolve dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build apk --release

      - name: Collect APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/probably-works-${VERSION}-android.apk"

      - name: Upload APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: probably-works-android
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [bump, build, server, web, server-web, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.bump.outputs.version }}
      SHA: ${{ needs.bump.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probably-works-*
          path: dist
          merge-multiple: true

      # Пакеты лежат в dist/<version>/, а gh принимает файлы, не каталоги. Имена файлов
      # содержат версию и платформу, поэтому конфликт имён считается ошибкой.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "dist/$name" ]; then
              echo "Конфликт имён артефактов: $name"
              exit 1
            fi
            mv "$file" dist/
          done < <(find dist -mindepth 2 -type f -print0)
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Релиз сначала создаётся черновиком, и ассеты загружаются в него. Черновик
      # невидим пользователям, поэтому частичная загрузка не попадает наружу.
      # Повторный запуск продолжает черновик; уже опубликованный релиз не трогается.
      - name: Create draft release and upload assets
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$is_draft" = "false" ]; then
              echo "Релиз $tag уже опубликован. Номер сборки не переиспользуется."
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$SHA" \
              --title "ProbablyWorks ${VERSION}" \
              --generate-notes \
              --draft
          fi

      # Тег появляется здесь, на SHA успешной сборки. Пока релиз в черновике, тега может
      # не быть; публикация создаёт его на target_commitish.
      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false
