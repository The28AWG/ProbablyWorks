name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate DI and routes
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate agent DI
        working-directory: packages/pw_agent
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test app
        run: flutter test

      - name: Archive generated sources
        run: |
          tar -czf generated-sources.tar.gz \
            lib/app/router/app_router.gr.dart \
            lib/app/di/injection.config.dart \
            lib/l10n/generated \
            packages/pw_agent/lib/agent_di.config.dart \
            packages/pw_agent/lib/core/db/app_database.g.dart

      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: generated-sources.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            targets: appimage,deb,tar.gz,zip
            artifact: probably-works-linux-x64
            suffix: '-x64'
          - os: windows-latest
            platform: windows
            targets: exe,zip
            artifact: probably-works-windows-x64
            suffix: '-x64'
          - os: macos-latest
            platform: macos
            targets: dmg,zip
            artifact: probably-works-macos-arm64
            suffix: '-arm64'
          - os: macos-15-intel
            platform: macos
            targets: dmg,zip
            artifact: probably-works-macos-x64
            suffix: '-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${expected}."
            echo "Create a tag like v${version} or update pubspec.yaml."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install Linux build and packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'macos'
        run: npm install --global appdmg

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: dart pub global activate fastforge 0.6.14

      - name: Add Fastforge to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Add Fastforge to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Pub\Cache\bin"

      - name: Build packages
        run: >-
          dart run tool/package/package.dart
          ${{ matrix.platform }}
          ${{ matrix.targets }}
          --artifact-suffix=${{ matrix.suffix }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  server:
    name: Server ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: probably-works-server-linux-x64
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: probably-works-server-windows-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact: probably-works-server-macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact: probably-works-server-macos-x64
    steps:
      - uses: actions/checkout@v4

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Package standalone server
        run: >-
          dart run tool/package/package_server.dart
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}

      - name: Upload server packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  snap:
    name: Build Snap
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: .

      - name: Extract generated sources
        run: tar -xzf generated-sources.tar.gz

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Add daemon to bundle
        env:
          PLATFORM: linux
          BUILD_OUTPUT_DIRECTORY: ${{ github.workspace }}/build/linux/x64/release/bundle
        run: dart run tool/package/prepare_daemon.dart

      - name: Build snap
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            myroslavmail/snapcraft@sha256:641e5191de3891925e6bb14be6cc24663add54af59762d37686604856e4a2573 \
            snapcraft pack --destructive-mode
          sudo chown -R "$USER:$USER" .
          mkdir -p dist
          mv ./*.snap dist/

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: probably-works-snap-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  snap-publish:
    name: Publish Snap to Store
    if: startsWith(github.ref, 'refs/tags/v')
    needs: snap
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probably-works-snap-amd64
          path: dist

      - name: Upload to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          docker run --rm \
            -e SNAPCRAFT_STORE_CREDENTIALS \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            myroslavmail/snapcraft@sha256:641e5191de3891925e6bb14be6cc24663add54af59762d37686604856e4a2573 \
            snapcraft upload --release=edge dist/*.snap

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server, snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probably-works-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
