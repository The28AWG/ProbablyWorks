name: flutter_pty2
description: Dart FFI pseudo-terminal (PTY) for spawning and controlling terminal processes, in Flutter apps and Dart command-line apps.
version: 3.0.0
homepage: https://github.com/SoFluffyOS/flutter_pty2
repository: https://github.com/SoFluffyOS/flutter_pty2
issue_tracker: https://github.com/SoFluffyOS/flutter_pty2/issues

environment:
  sdk: ^3.10.0

# Caret-диапазоны от проверенных версий. Точные используемые версии
# фиксирует корневой pubspec.lock; обновление вендоренного пакета — вручную
# по docs/agent/PTY.md, а не через dependabot.
dependencies:
  code_assets: ^2.2.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6

dev_dependencies:
  # Нужен только для запуска dart analyze внутри вендоренной копии.
  # ffigen и test не используются: биндинги лежат готовыми, тесты upstream
  # в вендоренную копию не входят.
  lints: ^6.1.0
